name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# @why 连续 push 时只保留最后一次部署，避免旧构建后完成把新版本盖回去
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @constraint 音效必须全量发布。这里原先是 `--no-sounds`，理由是
      #      「460MB 里 456MB 是音效，Pages 上限 1GB」。但裁掉之后站上 4961 条音效
      #      全部 404，试听形同虚设——列表越完整，坏得越明显。
      #      实测全量产物 467MB，仍在 1GB 以内；代价是首次部署要解 369MB .ogg，
      #      之后命中 mc-assets 缓存。
      - name: 缓存素材
        uses: actions/cache@v4
        with:
          path: mc-assets
          key: mc-assets-${{ hashFiles('mc-assets.lock.json') }}

      - name: 准备素材
        run: node scripts/fetch-assets.mjs 26.3 --lang=zh_cn,en_us

      - name: 构建
        run: pnpm build
        env:
          # @constraint Pages 项目站点挂在 /<repo>/ 下，路由与素材地址都要带这个前缀
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: 组装站点
        run: node scripts/assets.mjs pack --out=_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
